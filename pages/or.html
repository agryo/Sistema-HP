<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orçamento Rápido - Hotel Plaza</title>
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/or.css" />
  </head>
  <body>
    <div class="card">
      <div class="header-controls">
        <a href="../index.html" class="btn-voltar">🏠 Voltar ao Painel</a>
      </div>

      <h3 id="tituloFest">🎊 Orçamento</h3>

      <div class="form-group">
        <label>Tipo de Acomodação:</label>
        <select id="quarto" onchange="gerarOrcamento()"></select>
      </div>

      <div style="display: flex; gap: 10px">
        <div class="form-group" style="flex: 1">
          <label>Data de Entrada:</label>
          <input type="date" id="dataEntrada" onchange="gerarOrcamento()" />
        </div>
        <div class="form-group" style="flex: 1">
          <label>Data de Saída:</label>
          <input type="date" id="dataSaida" onchange="gerarOrcamento()" />
        </div>
      </div>

      <div id="previa">Preencha as datas para gerar a prévia...</div>

      <button class="btn-whatsapp" onclick="copiarTexto()">
        📋 COPIAR PARA O WHATSAPP
      </button>
    </div>

    <div id="modalMsg">
      <div class="modal-msg-content">
        <span id="msgIcon" class="modal-msg-icon"></span>
        <h3 id="msgTitle" style="margin: 0; color: #075e54"></h3>
        <p id="msgText" style="color: #666; margin-top: 10px"></p>
        <button class="btn-msg-ok" onclick="fecharModalMsg()">OK</button>
      </div>
    </div>

    <script src="../scripts/orcamento-rapido.js"></script>
  </body>
</html>
